# Project identification
sonar.projectKey=dadc1007_primitivefronted
sonar.organization=dadc1007

# Metadata
sonar.projectName=Primitive Clash Frontend
sonar.projectVersion=1.0

# Pull Request base branch
sonar.pullrequest.base=develop

# Source code
sonar.sources=src
sonar.tests=src

# Test inclusions (archivos de test)
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/__tests__/**/*.test.tsx,**/__tests__/**/*.spec.ts,**/__tests__/**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusions (archivos a ignorar en el análisis)
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/**,**/*.config.ts,**/*.config.js,**/coverage/**,**/*.d.ts,**/vite-env.d.ts,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage exclusions (archivos sin tests por diseño)
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/**,**/*.config.ts,**/*.config.js,**/coverage/**,**/*.d.ts,**/vite-env.d.ts,src/api/SignalRClient.ts,src/authConfig.ts,src/main.tsx,**/*.test.ts,**/*.test.tsx,**/__tests__/**

# Coverage - Solo LCOV para JavaScript/TypeScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json
